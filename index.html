<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shashwath V — Backend Engineer</title>
    <meta name="description" content="Computer science undergraduate building backend systems, developer tooling, and self-hosted infrastructure." />
    <!-- The mobile browser chrome sits directly above the topbar, which
         is the paper stock — so it has to be exactly --paper, not a
         cream that is nearly it. -->
    <meta name="theme-color" content="#ede8da" />

    <!-- The two drums, overprinting. Inline so the tab icon can't 404,
         and geometric so it survives being 16px in a tab strip. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131a36'/%3E%3Ccircle cx='12.5' cy='16' r='8.5' fill='%23ff5c39'/%3E%3Ccircle cx='19.5' cy='16' r='8.5' fill='%234fb0e4' opacity='.78'/%3E%3C/svg%3E"
    />

    <meta property="og:title" content="Shashwath V — Backend Engineer" />
    <meta property="og:description" content="Backend systems, developer tooling, and self-hosted infrastructure." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio.nw-right.dev/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Anton sets the name and every section head; the rest carry the
         zine's smaller voices — stencil labels, captions, pull quotes. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,900;1,900&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
